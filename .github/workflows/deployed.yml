name: CI - Build images, push to GHCR, deploy to Railway & Render

on:
  push:
    branches: ["main"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      ORG: ${{ secrets.ORG_NAME }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Build & push backend
      - name: Build backend image
        run: |
          docker build -f backend/Dockerfile -t ghcr.io/${{ env.ORG }}/backend:${{ env.COMMIT_SHA }} ./backend
      - name: Push backend image
        run: docker push ghcr.io/${{ env.ORG }}/backend:${{ env.COMMIT_SHA }}

      # Build & push frontend
      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile --build-arg VITE_API_URL=${{ secrets.RAILWAY_BACKEND_URL }} -t ghcr.io/${{ env.ORG }}/frontend:${{ env.COMMIT_SHA }} ./frontend
      - name: Push frontend image
        run: docker push ghcr.io/${{ env.ORG }}/frontend:${{ env.COMMIT_SHA }}

      # Optional: smoke test backend image (run ephemeral container and curl /health)
      - name: Smoke test backend image
        run: |
          docker run -d --rm --name smoke-back -p 8081:8080 ghcr.io/${{ env.ORG }}/backend:latest
          for i in {1..15}; do
            if curl -sSf http://127.0.0.1:8081/actuator/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker ps -a
        continue-on-error: false

      # Optional: smoke test frontend image
      - name: Smoke test frontend image
        run: |
          docker run -d --rm --name smoke-front -p 8082:80 ghcr.io/${{ env.ORG }}/frontend:latest
          for i in {1..15}; do
            if curl -sSf http://127.0.0.1:8082/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker ps -a
        continue-on-error: false

      # Deploy to Render via API (backend)
      - name: Trigger Render deploy (backend)
        if: success()
        run: |
          curl -X POST -sS \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imagePath\":\"ghcr.io/${{ env.ORG }}/backend:latest\"}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_BACKEND }}/deploys

      # Deploy to Render via API (frontend)
      - name: Trigger Render deploy (frontend)
        if: success()
        run: |
          curl -X POST -sS \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imagePath\":\"ghcr.io/${{ env.ORG }}/frontend:latest\"}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_FRONTEND }}/deploys
