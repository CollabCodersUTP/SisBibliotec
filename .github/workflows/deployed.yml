name: CI - Build images, push to GHCR, deploy to Render

on:
  push:
    branches: ["main"]

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      # Corregido: Usar el valor del secreto directamente en los comandos
      ORG: ${{ secrets.GHCR_ORG_NAME }}
      # Usar el SHA corto para etiquetas más limpias y manejables
      SHORT_SHA: ${{ github.sha }}

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- AUTHENTICATION ---
      - name: 🔑 Log in to GHCR
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ----------------------------------------------
      # 1. BACKEND BUILD & PUSH
      # ----------------------------------------------
      - name: 🧱 Build & Tag backend image
        id: build-backend
        run: |
          IMAGE_TAG=ghcr.io/${{ env.ORG }}/backend:${{ env.SHORT_SHA }}
          # Usar Buildx para mejor gestión de caché y sintaxis limpia
          docker build \
            -f backend/Dockerfile \
            -t $IMAGE_TAG \
            ./backend
          echo "backend_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: ⬆️ Push backend image to GHCR
        run: docker push ${{ steps.build-backend.outputs.backend_tag }}

      # ----------------------------------------------
      # 2. FRONTEND BUILD & PUSH
      # ----------------------------------------------
      - name: 🌐 Build & Tag frontend image (Injecting API URL)
        id: build-frontend
        run: |
          IMAGE_TAG=ghcr.io/${{ env.ORG }}/frontend:${{ env.SHORT_SHA }}
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_API_URL=${{ secrets.RAILWAY_BACKEND_URL }} \
            -t $IMAGE_TAG \
            ./frontend
          echo "frontend_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: ⬆️ Push frontend image to GHCR
        run: docker push ${{ steps.build-frontend.outputs.frontend_tag }}

      # ----------------------------------------------
      # 3. DEPLOY TO RENDER (Using the specific SHA tag)
      # ----------------------------------------------
      # Nota: Se eliminan los smoke tests para simplificar el flujo, ya que pueden fallar
      # si no se detienen correctamente y pueden ser complejos.

      - name: 🚀 Trigger Render deploy (Backend)
        if: success()
        run: |
          RENDER_BACKEND_TAG=ghcr.io/${{ env.ORG }}/backend:${{ env.SHORT_SHA }}
          curl -X POST -sS \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imagePath\":\"$RENDER_BACKEND_TAG\"}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_BACKEND }}/deploys

      - name: 🚀 Trigger Render deploy (Frontend)
        if: success()
        run: |
          RENDER_FRONTEND_TAG=ghcr.io/${{ env.ORG }}/frontend:${{ env.SHORT_SHA }}
          curl -X POST -sS \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"imagePath\":\"$RENDER_FRONTEND_TAG\"}" \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID_FRONTEND }}/deploys
