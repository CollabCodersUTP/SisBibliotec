name: Full Stack CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    name: Build React + Vite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build

  backend:
    name: Build Spring Boot
    runs-on: ubuntu-latest
    needs: frontend # No inicia hasta que frontend termine OK
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Backend (Maven)
        run: mvn clean package -DskipTests
