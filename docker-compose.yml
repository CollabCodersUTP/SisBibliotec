version: "3.9"

services:
  backend:
    build: ./backend
    container_name: api_spring
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    build: ./frontend
    container_name: react_app
    ports:
      - "3000:80"

networks:
  default:
    name: fullstack_net
